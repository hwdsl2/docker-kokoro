name: kokoro_test

on: workflow_call

permissions:
  contents: read

jobs:
  kokoro_test:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'hwdsl2'
    strategy:
      matrix:
        test_id: [no-env, with-env, with-key, empty-key, existing-no-key]
      fail-fast: false
    env:
      TEST_ID: ${{ matrix.test_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/workflows/tests
      - name: Test
        run: |
          [ ! -x /usr/bin/docker ] && exit 1

          cd "$GITHUB_WORKSPACE"
          pwd
          ls -ld kokoro.env.example

          sed -i \
            -e '/KOKORO_LOG_LEVEL=/s/# //' \
            -e '/KOKORO_VOICE=/s/# //' \
            kokoro.env.example

          set -ex

          docker build -t kokoro-test .

          if [ "$TEST_ID" = "existing-no-key" ]; then
            docker volume create kokoro-test-data
            docker run --rm --entrypoint sh \
              -v kokoro-test-data:/data \
              kokoro-test \
              -c 'printf "%s" "existing" > /data/.server_addr'
          fi

          if [ "$TEST_ID" = "with-env" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -e KOKORO_DISABLE_USAGE_COUNTS=1 \
              -v kokoro-test-data:/var/lib/kokoro \
              -v ./kokoro.env.example:/kokoro.env:ro \
              -p 8880:8880/tcp \
              -d kokoro-test
          elif [ "$TEST_ID" = "no-env" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -e KOKORO_DISABLE_USAGE_COUNTS=1 \
              -v kokoro-test-data:/var/lib/kokoro \
              -p 8880:8880/tcp \
              -d kokoro-test
          elif [ "$TEST_ID" = "with-key" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -e KOKORO_DISABLE_USAGE_COUNTS=1 \
              -v kokoro-test-data:/var/lib/kokoro \
              -e KOKORO_API_KEY=test-kokoro-key \
              -p 8880:8880/tcp \
              -d kokoro-test
          elif [ "$TEST_ID" = "empty-key" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -e KOKORO_DISABLE_USAGE_COUNTS=1 \
              -v kokoro-test-data:/var/lib/kokoro \
              -e KOKORO_API_KEY= \
              -p 8880:8880/tcp \
              -d kokoro-test
          elif [ "$TEST_ID" = "existing-no-key" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -e KOKORO_DISABLE_USAGE_COUNTS=1 \
              -v kokoro-test-data:/var/lib/kokoro \
              -p 8880:8880/tcp \
              -d kokoro-test
          fi

          # Wait for server to be ready (up to 300 seconds for model download)
          i=0
          while [ "$i" -lt 300 ]; do
            if docker exec "$TEST_ID" curl -sf http://127.0.0.1:8880/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
            i=$((i + 1))
          done

          docker ps | grep "$TEST_ID"
          docker logs "$TEST_ID"
          if [ "$TEST_ID" = "existing-no-key" ]; then
            docker logs "$TEST_ID" 2>&1 | grep -q 'Preserving no-auth behavior for backward compatibility'
          fi

          # Verify health endpoint
          docker exec "$TEST_ID" curl -sf http://127.0.0.1:8880/health

          # Build optional auth header args
          kokoro_curl_args=()
          if [ "$TEST_ID" = "with-key" ]; then
            kokoro_curl_args=(-H "Authorization: Bearer test-kokoro-key")
          elif [ "$TEST_ID" = "empty-key" ] || [ "$TEST_ID" = "existing-no-key" ]; then
            kokoro_key=$(docker exec "$TEST_ID" kokoro_manage --getkey 2>/dev/null || true)
            [ -z "$kokoro_key" ] || { echo "Expected no Kokoro API key, got $kokoro_key"; exit 1; }
            docker exec "$TEST_ID" test ! -f /var/lib/kokoro/.api_key
            docker exec "$TEST_ID" test ! -f /var/lib/kokoro/.auto_api_key_created
          else
            kokoro_key=$(docker exec "$TEST_ID" kokoro_manage --getkey)
            [ -n "$kokoro_key" ] || { echo "Generated Kokoro API key not found"; exit 1; }
            docker exec "$TEST_ID" test -f /var/lib/kokoro/.auto_api_key_created
            kokoro_curl_args=(-H "Authorization: Bearer $kokoro_key")
          fi

          if [ "${#kokoro_curl_args[@]}" -gt 0 ]; then
            # Test auth enforcement when KOKORO_API_KEY is set/generated
            http_code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8880/v1/audio/speech \
              -H "Content-Type: application/json" \
              -d '{"model":"tts-1","input":"Hi","voice":"af_heart"}' 2>/dev/null || true)
            [ "$http_code" = "401" ] || { echo "Expected 401 without key, got $http_code"; exit 1; }
          else
            # Explicit empty keys and existing no-key volumes preserve no-auth behavior.
            curl -sf http://127.0.0.1:8880/v1/models | grep -q '"object"'
          fi

          # Verify models endpoint
          curl -sf http://127.0.0.1:8880/v1/models \
            "${kokoro_curl_args[@]}" \
            | grep -q '"object"'

          check_pcm16le_matches_wav() {
            local pcm_path="$1"
            local wav_path="$2"
            python3 - "$pcm_path" "$wav_path" <<'PY'
          import pathlib
          import sys
          import wave

          pcm_path = pathlib.Path(sys.argv[1])
          wav_path = pathlib.Path(sys.argv[2])
          pcm = pcm_path.read_bytes()
          if not pcm:
              raise SystemExit(f"{pcm_path} is empty")
          if len(pcm) % 2:
              raise SystemExit(f"{pcm_path} length is not aligned to 16-bit samples: {len(pcm)}")

          with wave.open(str(wav_path), "rb") as wav:
              if wav.getnchannels() != 1:
                  raise SystemExit(f"{wav_path} is not mono: {wav.getnchannels()} channels")
              if wav.getframerate() != 24000:
                  raise SystemExit(f"{wav_path} sample rate is not 24000 Hz: {wav.getframerate()}")
              if wav.getsampwidth() != 2:
                  raise SystemExit(f"{wav_path} sample width is not 16-bit: {wav.getsampwidth()} bytes")
              expected_bytes = wav.getnframes() * wav.getnchannels() * wav.getsampwidth()

          if len(pcm) != expected_bytes:
              raise SystemExit(
                  f"{pcm_path} has {len(pcm)} bytes; expected {expected_bytes} bytes "
                  f"for raw PCM_S16LE matching {wav_path}"
              )
          PY
          }

          # Test kokoro_manage commands
          docker exec "$TEST_ID" kokoro_manage --showinfo
          docker exec "$TEST_ID" kokoro_manage --listvoices

          # Test speech endpoint (mp3 format)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart"}' \
            -o /tmp/test_speech.mp3 \
            && [ -s /tmp/test_speech.mp3 ]

          # Test speech endpoint (wav format)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart","response_format":"wav"}' \
            -o /tmp/test_speech.wav \
            && [ -s /tmp/test_speech.wav ]

          # Test speech endpoint (pcm format — verifies raw PCM_S16LE path)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart","response_format":"pcm"}' \
            -o /tmp/test_speech.pcm \
            && check_pcm16le_matches_wav /tmp/test_speech.pcm /tmp/test_speech.wav

          # Test speech endpoint (flac format)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart","response_format":"flac"}' \
            -o /tmp/test_speech.flac \
            && [ -s /tmp/test_speech.flac ]

          # Test speech endpoint (British voice — verifies auto lang_code selection)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello from London.","voice":"bf_emma","response_format":"wav"}' \
            -o /tmp/test_speech_british.wav \
            && [ -s /tmp/test_speech_british.wav ]

          # Test streaming endpoint (pcm format — verifies stream_format="audio" path)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart","response_format":"pcm","stream_format":"audio"}' \
            -o /tmp/test_speech_stream.pcm \
            && check_pcm16le_matches_wav /tmp/test_speech_stream.pcm /tmp/test_speech.wav

          # Test SSE streaming endpoint (verifies stream_format="sse" path)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart","response_format":"mp3","stream_format":"sse"}' \
            -o /tmp/test_speech_sse.txt \
            && grep -q "speech.audio.delta" /tmp/test_speech_sse.txt \
            && grep -q "speech.audio.done" /tmp/test_speech_sse.txt

          # Test SSE streaming endpoint (pcm format — verifies SSE PCM_S16LE path)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart","response_format":"pcm","stream_format":"sse"}' \
            -o /tmp/test_speech_sse_pcm.txt \
            && python3 - /tmp/test_speech_sse_pcm.txt /tmp/test_speech_sse.pcm <<'PY'
          import base64
          import json
          import pathlib
          import sys

          sse_path = pathlib.Path(sys.argv[1])
          pcm_path = pathlib.Path(sys.argv[2])
          chunks = []
          seen_done = False
          for line in sse_path.read_text().splitlines():
              if not line.startswith("data: "):
                  continue
              data = line[len("data: "):]
              if data == "[DONE]":
                  seen_done = True
                  continue
              event = json.loads(data)
              if event.get("type") == "speech.audio.delta":
                  chunks.append(base64.b64decode(event["audio"]))
              elif event.get("type") == "speech.audio.done":
                  seen_done = True
          if not chunks:
              raise SystemExit("No speech.audio.delta chunks found in SSE PCM response")
          if not seen_done:
              raise SystemExit("No done marker found in SSE PCM response")
          for idx, chunk in enumerate(chunks, start=1):
              if chunk.startswith(b"RIFF") and chunk[8:12] == b"WAVE":
                  raise SystemExit(f"SSE PCM delta #{idx} unexpectedly contains a WAV header")
          pcm_path.write_bytes(b"".join(chunks))
          PY
          check_pcm16le_matches_wav /tmp/test_speech_sse.pcm /tmp/test_speech.wav

          # Test SSE streaming endpoint (wav format — verifies header once, then PCM)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world. This is a second sentence.","voice":"af_heart","response_format":"wav","stream_format":"sse"}' \
            -o /tmp/test_speech_sse_wav.txt \
            && python3 - /tmp/test_speech_sse_wav.txt /tmp/test_speech_sse.wav <<'PY'
          import base64
          import json
          import pathlib
          import struct
          import sys

          sse_path = pathlib.Path(sys.argv[1])
          wav_path = pathlib.Path(sys.argv[2])
          chunks = []
          seen_done = False
          for line in sse_path.read_text().splitlines():
              if not line.startswith("data: "):
                  continue
              data = line[len("data: "):]
              if data == "[DONE]":
                  seen_done = True
                  continue
              event = json.loads(data)
              if event.get("type") == "speech.audio.delta":
                  chunks.append(base64.b64decode(event["audio"]))
              elif event.get("type") == "speech.audio.done":
                  seen_done = True
          if len(chunks) < 2:
              raise SystemExit(f"Expected WAV header plus audio deltas, got {len(chunks)} delta(s)")
          if not seen_done:
              raise SystemExit("No done marker found in SSE WAV response")
          header = chunks[0]
          expected_header = struct.pack(
              "<4sI4s4sIHHIIHH4sI",
              b"RIFF", 0xFFFFFFFF, b"WAVE",
              b"fmt ", 16,
              1, 1, 24000, 48000, 2, 16,
              b"data", 0xFFFFFFFF,
          )
          if header != expected_header:
              raise SystemExit("First SSE WAV delta is not the exact 24 kHz mono streaming WAV header")
          for idx, chunk in enumerate(chunks[1:], start=2):
              if chunk.startswith(b"RIFF") and chunk[8:12] == b"WAVE":
                  raise SystemExit(f"SSE WAV delta #{idx} unexpectedly contains another WAV header")
          wav_bytes = b"".join(chunks)
          if len(wav_bytes) <= 44:
              raise SystemExit("SSE WAV payload contains no PCM bytes after the header")
          if (len(wav_bytes) - 44) % 2:
              raise SystemExit("SSE WAV PCM payload is not aligned to 16-bit samples")
          wav_path.write_bytes(wav_bytes)
          PY

          # Test required fields enforcement (missing voice should return 422)
          http_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world"}' 2>/dev/null || true)
          [ "$http_code" = "422" ] || { echo "Expected 422 without voice, got $http_code"; exit 1; }

          # Test required fields enforcement (missing model should return 422)
          http_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"input":"Hello world","voice":"af_heart"}' 2>/dev/null || true)
          [ "$http_code" = "422" ] || { echo "Expected 422 without model, got $http_code"; exit 1; }

          # Test volume_multiplier field (verifies volume scaling path)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart","response_format":"wav","volume_multiplier":1.5}' \
            -o /tmp/test_speech_volume.wav \
            && [ -s /tmp/test_speech_volume.wav ]

          # Test speed field (verifies speed scaling path)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"af_heart","response_format":"wav","speed":1.25}' \
            -o /tmp/test_speech_speed.wav \
            && [ -s /tmp/test_speech_speed.wav ]

          # Test OpenAI voice alias (verifies alias mapping path)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"alloy","response_format":"wav"}' \
            -o /tmp/test_speech_alias.wav \
            && [ -s /tmp/test_speech_alias.wav ]

          # Test OpenAI voice object (verifies voice.id request shape)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":{"id":"alloy"},"response_format":"wav"}' \
            -o /tmp/test_speech_voice_object.wav \
            && [ -s /tmp/test_speech_voice_object.wav ]

          # Test newer OpenAI voice alias (verifies extended alias mapping path)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"ballad","response_format":"wav"}' \
            -o /tmp/test_speech_ballad.wav \
            && [ -s /tmp/test_speech_ballad.wav ]

          # Test unknown voices return 400 instead of falling back silently
          http_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":"not_a_voice"}' 2>/dev/null || true)
          [ "$http_code" = "400" ] || { echo "Expected 400 for unknown voice, got $http_code"; exit 1; }

          http_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Hello world","voice":{"id":"not_a_voice"}}' 2>/dev/null || true)
          [ "$http_code" = "400" ] || { echo "Expected 400 for unknown voice object, got $http_code"; exit 1; }

          # Test voices endpoint (verify non-English voices are listed)
          curl -sf http://127.0.0.1:8880/v1/voices \
            "${kokoro_curl_args[@]}" \
            | grep -q '"voices"'
          curl -sf http://127.0.0.1:8880/v1/voices \
            "${kokoro_curl_args[@]}" \
            | grep -q 'im_nicola'

          # Test Italian voice (verifies non-English language pipeline loads on demand)
          curl -sf http://127.0.0.1:8880/v1/audio/speech \
            -H "Content-Type: application/json" \
            "${kokoro_curl_args[@]}" \
            -d '{"model":"tts-1","input":"Ciao mondo","voice":"im_nicola","response_format":"wav"}' \
            -o /tmp/test_speech_italian.wav \
            && [ -s /tmp/test_speech_italian.wav ]

          docker restart "$TEST_ID"

          sleep 15

          # Wait for server to come back (up to 120 seconds)
          i=0
          while [ "$i" -lt 120 ]; do
            if docker exec "$TEST_ID" curl -sf http://127.0.0.1:8880/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
            i=$((i + 1))
          done

          docker ps | grep "$TEST_ID"
          docker logs "$TEST_ID"

          # Verify server is healthy after restart
          docker exec "$TEST_ID" curl -sf http://127.0.0.1:8880/health

          exit 0
      - name: Clear
        if: always()
        run: |
          docker rm -f "$TEST_ID" || true
          docker volume rm kokoro-test-data || true
          docker rmi kokoro-test || true
